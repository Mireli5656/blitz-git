<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLITZ tests</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --ok: #15803d; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --muted: #999; --line: #2e2e2e; --ok: #4ade80; --bad: #f87171; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 820px; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  #summary { font-weight: 600; margin: 8px 0 12px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .err { color: var(--muted); font-size: 13px; display: block; }
</style>
</head>
<body>
  <h1>BLITZ tests</h1>
  <div id="summary">Running...</div>
  <ul id="list"></ul>

<script type="module">
  import { runAll } from "./tests.js";

  const list = document.getElementById("list");
  const summary = document.getElementById("summary");

  const results = await runAll((r) => {
    const li = document.createElement("li");
    const mark = document.createElement("span");
    mark.className = r.ok ? "ok" : "bad";
    mark.textContent = r.skipped ? "SKIP " : r.ok ? "PASS " : "FAIL ";
    li.appendChild(mark);
    li.appendChild(document.createTextNode(r.name));
    if (!r.ok || r.skipped) {
      const err = document.createElement("span");
      err.className = "err";
      err.textContent = r.skipped ? r.note : r.error;
      li.appendChild(err);
    }
    list.appendChild(li);
  });

  const failed = results.filter((r) => !r.ok).length;
  const skipped = results.filter((r) => r.skipped).length;
  summary.textContent = failed
    ? `${failed} of ${results.length} tests failed`
    : `All ${results.length - skipped} tests passed` + (skipped ? ` (${skipped} skipped)` : "");
  summary.className = failed ? "bad" : "ok";
</script>
</body>
</html>
